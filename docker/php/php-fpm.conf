[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

; Send errors to stderr so Docker/supervisor captures them
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
